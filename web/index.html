<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<title>地图 · MapForZZ7Z</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body class="map-page">

<div id="map"></div>

<!-- 顶部标题栏 -->
<header class="topbar">
  <div class="topbar-left">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v13.5M15 6.5V20" stroke="currentColor" stroke-width="1.6"/></svg>
    </div>
    <span class="brand-name">地图</span>
  </div>
  <nav class="topbar-right">
    <a class="pill active" href="./index.html">地图</a>
    <a class="pill" href="./3d.html">三维模型 &amp; 点云</a>
  </nav>
</header>

<!-- 左下 比例尺 / 右下 控件 -->
<div class="map-legend" id="legend">
  <div class="legend-title">郑州 · 正射影像</div>
  <div class="legend-row"><span id="zoomLabel">z17</span><span class="dot"></span><span id="resLabel">1.0 m/px</span></div>
</div>

<div class="map-controls">
  <button class="ctl" id="btnZoomIn" title="放大" aria-label="放大">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button class="ctl" id="btnZoomOut" title="缩小" aria-label="缩小">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="ctl-sep"></div>
  <button class="ctl" id="btnCompass" title="指北" aria-label="指北">
    <svg id="compassIcon" viewBox="0 0 24 24" width="18" height="18"><path d="M12 3l4 9-4-2.2L8 12z" fill="currentColor" opacity=".9"/><path d="M12 21l-4-9 4 2.2L16 12z" fill="currentColor" opacity=".35"/></svg>
  </button>
</div>

<div class="attribution">
  影像 © 项目测绘成果 · 渲染 MapLibre GL
</div>

<script src="./vendor/maplibre-gl.js"></script>
<script src="./js/map.js"></script>
</body>
</html>
